<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edufy - Login</title>
    <link rel="icon" href="../../templates/images/favicon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
        }
        .auth-container {
            background: rgba(15, 15, 15, 0);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-field {
            background: rgba(30, 30, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-field:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.3);
        }
        .logo-glow {
            filter: drop-shadow(0 0 8px rgba(74, 144, 226, 0.6));
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div id="vanta-bg" class="fixed top-0 left-0 w-full h-full z-0"></div>

<div class="relative z-10 w-full max-w-md mx-auto">
    <div class="auth-container rounded-2xl p-8 shadow-xl mx-auto" data-aos="fade-up" style="max-width: 28rem;">
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <img src="https://huggingface.co/spaces/Mekashiki/edufy-brainy-login-portal/resolve/main/images/favicon.png" alt="Edufy Logo" class="h-16 w-16 rounded-full object-cover logo-glow">
            </div>
            <h1 class="text-4xl font-bold mb-2 font-space logo-glow text-white">Edufy</h1>
            <p class="text-white">Curiosity is the beginning of knowledge.</p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
            <div class="relative">
                <label for="login-email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                <div class="relative">
                    <input type="email" id="login-email" class="input-field w-full px-4 py-3 rounded-lg focus:outline-none pl-10" placeholder="your@email.com" required>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-mail absolute left-3 top-3.5 text-gray-400 w-4 h-4">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="relative">
                <label for="login-password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="login-password" class="input-field w-full px-4 py-3 rounded-lg focus:outline-none pl-10 pr-10" placeholder="••••••••" required>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-lock absolute left-3 top-3.5 text-gray-400 w-4 h-4">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span id="toggle-password" class="absolute right-3 top-3.5 cursor-pointer text-gray-400 hover:text-gray-300">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye w-4 h-4">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>
            </div>
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input id="remember-me" type="checkbox" class="sr-only peer">
                        <div class="w-9 h-5 bg-gray-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                        <span class="ml-3 text-sm text-gray-300">Remember me</span>
                    </label>
                </div>
                <a href="https://access.edufyuzbekistan.com/reset_password" class="text-sm text-blue-400 hover:text-blue-300 transition-colors">Forgot password?</a>
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-400 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-full transition-all duration-300 flex items-center justify-center shadow-lg hover:shadow-blue-500/20 transform hover:-translate-y-1 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                Sign In
            </button>
            <div class="text-center mt-4 text-sm text-gray-300">
                Don't have an account? <a href="https://access.edufyuzbekistan.com/register" class="text-blue-400 hover:text-blue-300 font-medium transition-colors">Sign up</a>
            </div>
            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-gray-600"></div>
                <span class="flex-shrink mx-4 text-gray-400 text-sm">OR</span>
                <div class="flex-grow border-t border-gray-600"></div>
            </div>
            <button type="button" onclick="handleGoogleSignIn()" class="w-full bg-white hover:bg-gray-100 text-gray-800 font-bold py-3 px-4 rounded-full transition-all duration-300 flex items-center justify-center shadow-lg hover:shadow-gray-300/20 transform hover:-translate-y-1">
                <img src="../../templates/images/g.webp=s48-fcrop64=1,00000000ffffffff-rw" alt="Google logo" class="w-7 h-7 mr-2">
                <span>Sign in with Google</span>
            </button>
            <p class="text-xs text-gray-400 text-center mt-4">
                By continuing, you agree to our <a href="https://edufyuzbekistan.com/termsofservice" target="_blank" class="text-blue-400 hover:text-white text-sm transition-colors">
                Terms of Service,
            </a>
                <a href="https://edufyuzbekistan.com/privacy_policy" target="_blank" class="text-blue-400 hover:text-white text-sm transition-colors">
                    Privacy Policy <a>and</a>
                </a>
                <a href="https://edufyuzbekistan.com/cookies" target="_blank" class="text-blue-400 hover:text-white text-sm transition-colors">
                    Cookies Policy
                </a>.
            </p>
        </form>
    </div>
</div>
<script>
    function handleGoogleSignIn() {
        console.log('Google Sign In clicked');
    }

    // Enable submit button when form is valid
    document.addEventListener('DOMContentLoaded', function() {
        const emailInput = document.getElementById('login-email');
        const passwordInput = document.getElementById('login-password');
        const submitBtn = document.getElementById('submit-btn');

        function validateForm() {
            const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value);
            const passwordValid = passwordInput.value.length >= 8;
            submitBtn.disabled = !(emailValid && passwordValid);
        }

        emailInput.addEventListener('input', validateForm);
        passwordInput.addEventListener('input', validateForm);
    });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
<script>
    AOS.init({ duration: 800, easing: 'ease-in-out', once: true });

    // Toggle password visibility
    const togglePassword = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('login-password');

    togglePassword.addEventListener('click', function() {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';

        // Update eye icon
        const eyeIcon = togglePassword.querySelector('svg');
        eyeIcon.setAttribute('data-feather', isPassword ? 'eye-off' : 'eye');
        feather.replace();
    });
    VANTA.NET({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: 1.00,
        scaleMobile: 1.00,
        color: 0x3a86ff,
        backgroundColor: 0x0a0a0a,
        points: 16.00,
        maxDistance: 22.00,
        spacing: 18.00,
        showDots: false
    });

    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        console.log('Login submitted');
    });

    feather.replace();
</script>
</body>
</html>
