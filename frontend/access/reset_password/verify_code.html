<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edufy - Verify Code</title>
    <link rel="icon" href="../../templates/images/favicon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
        }
        .auth-container {
            background: rgba(15, 15, 15, 0);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-field {
            background: rgba(30, 30, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-field:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.3);
        }
        .logo-glow {
            filter: drop-shadow(0 0 8px rgba(74, 144, 226, 0.6));
        }
        .code-input {
            letter-spacing: 0.5em;
            text-align: center;
            font-size: 1.5rem;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div id="vanta-bg" class="fixed top-0 left-0 w-full h-full z-0"></div>

<div class="relative z-10 w-full max-w-md mx-auto">
    <div class="auth-container rounded-2xl p-8 shadow-xl mx-auto" data-aos="fade-up" style="max-width: 28rem;">
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <img src="https://huggingface.co/spaces/Mekashiki/edufy-brainy-login-portal/resolve/main/images/favicon.png" alt="Edufy Logo" class="h-16 w-16 rounded-full object-cover logo-glow">
            </div>
            <h1 class="text-4xl font-bold mb-2 font-space logo-glow text-white">Reset Password</h1>
            <p class="text-white">Enter the 6-digit verification code sent to your email</p>
        </div>

        <form id="verify-form" class="space-y-6">
            <div class="flex justify-center gap-3">
                <input type="text" maxlength="1" class="code-input w-12 h-16 text-center rounded-lg input-field focus:outline-none" pattern="[0-9]" required inputmode="numeric" onkeypress="return event.charCode >= 48 && event.charCode <= 57">
                <input type="text" maxlength="1" class="code-input w-12 h-16 text-center rounded-lg input-field focus:outline-none" pattern="[0-9]" required inputmode="numeric" onkeypress="return event.charCode >= 48 && event.charCode <= 57">
                <input type="text" maxlength="1" class="code-input w-12 h-16 text-center rounded-lg input-field focus:outline-none" pattern="[0-9]" required inputmode="numeric" onkeypress="return event.charCode >= 48 && event.charCode <= 57">
                <input type="text" maxlength="1" class="code-input w-12 h-16 text-center rounded-lg input-field focus:outline-none" pattern="[0-9]" required inputmode="numeric" onkeypress="return event.charCode >= 48 && event.charCode <= 57">
                <input type="text" maxlength="1" class="code-input w-12 h-16 text-center rounded-lg input-field focus:outline-none" pattern="[0-9]" required inputmode="numeric" onkeypress="return event.charCode >= 48 && event.charCode <= 57">
                <input type="text" maxlength="1" class="code-input w-12 h-16 text-center rounded-lg input-field focus:outline-none" pattern="[0-9]" required inputmode="numeric" onkeypress="return event.charCode >= 48 && event.charCode <= 57">
            </div>

            <div id="new-password-fields" class="hidden space-y-4">
                <div>
                    <label for="new-password" class="block text-sm font-medium text-gray-300 mb-1">New Password</label>
                    <div class="relative">
                        <input type="password" id="new-password" class="input-field w-full px-4 py-3 rounded-lg focus:outline-none pl-10" placeholder="••••••••" required minlength="8">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-lock absolute left-3 top-3.5 text-gray-400 w-4 h-4">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>
                </div>
                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-gray-300 mb-1">Confirm Password</label>
                    <div class="relative">
                        <input type="password" id="confirm-password" class="input-field w-full px-4 py-3 rounded-lg focus:outline-none pl-10" placeholder="••••••••" required minlength="8">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-lock absolute left-3 top-3.5 text-gray-400 w-4 h-4">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-400 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-full transition-all duration-300 flex items-center justify-center shadow-lg hover:shadow-blue-500/20 transform hover:-translate-y-1">
                Verify Code
            </button>
            <div class="text-center text-sm text-gray-300">
                Didn't receive code?
                <span id="resend-container">
                    <a href="#" id="resend-code" class="text-blue-400 hover:text-blue-300 font-medium transition-colors">Resend</a>
                </span>
                <span id="resend-timer" class="hidden">
                    Resend available in <span id="countdown">60</span>s
                </span>
            </div>
        </form>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
<script>
    AOS.init({ duration: 800, easing: 'ease-in-out', once: true });

    VANTA.NET({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: 1.00,
        scaleMobile: 1.00,
        color: 0x3a86ff,
        backgroundColor: 0x0a0a0a,
        points: 16.00,
        maxDistance: 22.00,
        spacing: 18.00,
        showDots: false
    });
    // Handle code input auto-focus and numeric only
    const codeInputs = document.querySelectorAll('.code-input');
    codeInputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            // Ensure only numbers are entered
            e.target.value = e.target.value.replace(/\D/g, '');

            if (e.target.value.length === 1 && index < codeInputs.length - 1) {
                codeInputs[index + 1].focus();
            }
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !e.target.value && index > 0) {
                codeInputs[index - 1].focus();
            }
        });

        // Prevent paste of non-numeric content
        input.addEventListener('paste', (e) => {
            e.preventDefault();
            const pasteData = e.clipboardData.getData('text');
            const numericData = pasteData.replace(/\D/g, '');
            if (numericData.length === 6) {
                // If pasted a full 6-digit code, distribute it
                for (let i = 0; i < 6; i++) {
                    if (codeInputs[i]) {
                        codeInputs[i].value = numericData[i];
                    }
                }
                codeInputs[5].focus();
            }
        });
    });
    // Form submission handling
    document.getElementById('verify-form').addEventListener('submit', (e) => {
        e.preventDefault();

        const codeInputs = document.querySelectorAll('.code-input');
        let verificationCode = '';
        codeInputs.forEach(input => {
            verificationCode += input.value;
        });

        if (verificationCode.length === 6) {
            if (document.getElementById('new-password-fields').classList.contains('hidden')) {
                // First submit - verify code
                // In a real app, you would verify the code with your backend
                document.getElementById('new-password-fields').classList.remove('hidden');
                document.getElementById('submit-btn').textContent = 'Reset Password';
            } else {
                // Second submit - reset password
                const newPassword = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                if (newPassword !== confirmPassword) {
                    alert('Passwords do not match!');
                    return;
                }

                // In a real app, you would send the new password to your backend
                alert('Password has been reset successfully!');
                window.location.href = 'https://access.edufyuzbekistan.com/reset_password/verify_code/new_password';
            }
        } else {
            alert('Please enter a 6-digit verification code');
        }
    });
    // Resend code functionality with timer
    document.getElementById('resend-code').addEventListener('click', (e) => {
        e.preventDefault();
        // In a real app, you would call your backend to resend the code
        alert('Verification code has been resent to your email');

        // Start cooldown timer
        const resendBtn = document.getElementById('resend-code');
        const resendContainer = document.getElementById('resend-container');
        const timerContainer = document.getElementById('resend-timer');
        const countdownElement = document.getElementById('countdown');

        resendContainer.classList.add('hidden');
        timerContainer.classList.remove('hidden');

        let timeLeft = 60;
        countdownElement.textContent = timeLeft;

        const timer = setInterval(() => {
            timeLeft--;
            countdownElement.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                timerContainer.classList.add('hidden');
                resendContainer.classList.remove('hidden');
            }
        }, 1000);
    });
    feather.replace();
</script>
</body>
</html>
