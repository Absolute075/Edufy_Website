<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edufy - Login</title>
    <link rel="icon" href="templates/images/favicon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
        }
        .auth-container {
            background: rgba(15, 15, 15, 0);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-field {
            background: rgba(30, 30, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-field:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.3);
        }
        .logo-glow {
            filter: drop-shadow(0 0 8px rgba(74, 144, 226, 0.6));
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div id="vanta-bg" class="fixed top-0 left-0 w-full h-full z-0"></div>

<div class="relative z-10 w-full max-w-md mx-auto">
    <div class="auth-container rounded-2xl p-8 shadow-xl mx-auto" data-aos="fade-up" style="max-width: 28rem;">
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <img src="https://huggingface.co/spaces/Mekashiki/edufy-brainy-login-portal/resolve/main/images/favicon.png" alt="Edufy Logo" class="h-16 w-16 rounded-full object-cover logo-glow">
            </div>
            <h1 class="text-4xl font-bold mb-2 font-space logo-glow text-white">Edufy</h1>
            <p class="text-white">Curiosity is the beginning of knowledge.</p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
            <div class="relative">
                <label for="login-username" class="block text-sm font-medium text-gray-300 mb-1">Username</label>
                <div class="relative">
                    <input type="text" id="login-username" class="input-field w-full px-4 py-3 rounded-lg focus:outline-none pl-10" placeholder="Username" required>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-user absolute left-3 top-3.5 text-gray-400 w-4 h-4">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
            </div>
            <div class="relative">
                <label for="login-email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                <div class="relative">
                    <input type="email" id="login-email" class="input-field w-full px-4 py-3 rounded-lg focus:outline-none pl-10" placeholder="your@email.com" required>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-mail absolute left-3 top-3.5 text-gray-400 w-4 h-4">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </div>
            </div>
            <div class="relative">
                <label for="login-password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="login-password" class="input-field w-full px-4 py-3 rounded-lg focus:outline-none pl-10 pr-10" placeholder="••••••••" required slot="password-field">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-lock absolute left-3 top-3.5 text-gray-400 w-4 h-4">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span id="toggle-password" class="absolute right-3 top-3.5 cursor-pointer text-gray-400 hover:text-gray-300">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye w-4 h-4">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>
                <password-strength>
                    <input type="password" slot="password-field" id="password-strength-input" class="hidden">
                    <input type="password" slot="confirm-field" id="password-confirm-input" class="hidden">
                </password-strength>
            </div>
            <div class="relative">
                <label for="confirm-password" class="block text-sm font-medium text-gray-300 mb-1">Confirm Password</label>
                <div class="relative">
                    <input type="password" id="confirm-password" class="input-field w-full px-4 py-3 rounded-lg focus:outline-none pl-10 pr-10" placeholder="••••••••" required>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-lock absolute left-3 top-3.5 text-gray-400 w-4 h-4">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span id="toggle-confirm-password" class="absolute right-3 top-3.5 cursor-pointer text-gray-400 hover:text-gray-300">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye w-4 h-4">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>
                <div id="password-match-status" class="text-sm mt-1"></div>
            </div>
            <button type="submit" id="signup-button" class="w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-400 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-full transition-all duration-300 flex items-center justify-center shadow-lg hover:shadow-blue-500/20 transform hover:-translate-y-1 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none disabled:hover:shadow-none" disabled>
                Sign Up
            </button>
            <div class="text-center mt-4 text-sm text-gray-300">
                Already have an account? <a href="https://access.edufyuzbekistan.com/login" class="text-blue-400 hover:text-blue-300 font-medium transition-colors">Sign in</a>
            </div>
            <p class="text-xs text-gray-400 text-center mt-4">
                By continuing, you agree to our <a href="https://edufyuzbekistan.com/termsofservice" target="_blank" class="text-blue-400 hover:text-white text-sm transition-colors">
                Terms of Service,
            </a>
                <a href="https://edufyuzbekistan.com/privacy_policy" target="_blank" class="text-blue-400 hover:text-white text-sm transition-colors">
                    Privacy Policy <a>and</a>
                </a>
                <a href="https://edufyuzbekistan.com/cookies" target="_blank" class="text-blue-400 hover:text-white text-sm transition-colors">
                    Cookies Policy
                </a>.
            </p>
        </form>
    </div>
</div>

<script src="components/password-strength.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
<script>
    AOS.init({ duration: 800, easing: 'ease-in-out', once: true });
    const passwordInput = document.getElementById('login-password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const togglePassword = document.getElementById('toggle-password');
    const toggleConfirmPassword = document.getElementById('toggle-confirm-password');
    const passwordMatchStatus = document.getElementById('password-match-status');

    // Toggle password visibility
    togglePassword.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        togglePassword.querySelector('svg').setAttribute('data-feather', type === 'password' ? 'eye' : 'eye-off');
        feather.replace();
    });

    toggleConfirmPassword.addEventListener('click', () => {
        const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        confirmPasswordInput.setAttribute('type', type);
        toggleConfirmPassword.querySelector('svg').setAttribute('data-feather', type === 'password' ? 'eye' : 'eye-off');
        feather.replace();
    });

    class PasswordStrength extends HTMLElement {
        constructor() {
            super();
            this.attachShadow({mode: 'open'});
        }

        connectedCallback() {
            this.render();
            this.setupEventListeners();
        }

        render() {
            this.shadowRoot.innerHTML = `
      <style>
        :host {
          display: block;
          margin-bottom: 1rem;
        }

        .password-container {
          position: relative;
          margin-bottom: 1rem;
        }

        .strength-meter {
          display: flex;
          gap: 2px;
          margin-top: 0.5rem;
          height: 4px;
        }

        .strength-segment {
          flex: 1;
          height: 100%;
          background: #374151;
          border-radius: 2px;
          transition: all 0.3s ease;
        }

        .strength-segment.active {
          background: #ef4444;
        }

        .strength-segment.active.weak {
          background: #f59e0b;
        }

        .strength-segment.active.medium {
          background: #3b82f6;
        }

        .strength-segment.active.strong {
          background: #10b981;
        }

        .strength-text {
          font-size: 0.75rem;
          margin-top: 0.25rem;
          color: #9ca3af;
          transition: color 0.3s ease;
        }

        .strength-text.very-weak { color: #ef4444; }
        .strength-text.weak { color: #f59e0b; }
        .strength-text.medium { color: #3b82f6; }
        .strength-text.strong { color: #10b981; }

        .confirmation-text {
          font-size: 0.75rem;
          margin-top: 0.25rem;
          transition: color 0.3s ease;
        }

        .confirmation-text.matching {
          color: #10b981;
        }

        .confirmation-text.not-matching {
          color: #ef4444;
        }
      </style>

      <div class="password-container">
        <slot name="password-field"></slot>
        <div class="strength-meter">
          <div class="strength-segment" id="segment-1"></div>
          <div class="strength-segment" id="segment-2"></div>
          <div class="strength-segment" id="segment-3"></div>
          <div class="strength-segment" id="segment-4"></div>
        </div>
        <div class="strength-text" id="strength-text">Enter Password</div>
      </div>

      <div class="password-container">
        <slot name="confirm-field"></slot>
        <div class="confirmation-text" id="confirmation-text"></div>
      </div>
    `;
        }

        setupEventListeners() {
            const passwordInput = this.querySelector('input[type="password"][slot="password-field"]');
            const confirmInput = this.querySelector('input[type="password"][slot="confirm-field"]');

            if (passwordInput) {
                passwordInput.addEventListener('input', () => {
                    this.updateStrength(passwordInput.value);
                    this.checkConfirmation(passwordInput.value, confirmInput?.value || '');
                });
            }

            if (confirmInput) {
                confirmInput.addEventListener('input', () => {
                    this.checkConfirmation(passwordInput?.value || '', confirmInput.value);
                });
            }
        }

        updateStrength(password) {
            const strength = this.calculateStrength(password);
            const segments = this.shadowRoot.querySelectorAll('.strength-segment');
            const strengthText = this.shadowRoot.getElementById('strength-text');

            // Reset all segments
            segments.forEach(segment => {
                segment.classList.remove('active', 'weak', 'medium', 'strong');
            });

            // Update active segments
            for (let i = 0; i < strength.score; i++) {
                if (segments[i]) {
                    segments[i].classList.add('active');

                    if (strength.score === 1) segments[i].classList.add('weak');
                    if (strength.score === 2) segments[i].classList.add('weak');
                    if (strength.score === 3) segments[i].classList.add('medium');
                    if (strength.score === 4) segments[i].classList.add('strong');
                }
            }

            // Update text
            strengthText.textContent = strength.text;
            strengthText.className = 'strength-text';
            if (strength.score > 0) {
                strengthText.classList.add(strength.className);
            }
        }

        calculateStrength(password) {
            if (!password) return {score: 0, text: 'Enter Password', className: ''};

            let score = 0;
            const hasMinLength = password.length >= 8;
            const hasLowerCase = /[a-z]/.test(password);
            const hasUpperCase = /[A-Z]/.test(password);
            const hasNumbers = /\d/.test(password);
            const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);

            if (hasMinLength) score++;
            if (hasLowerCase) score++;
            if (hasUpperCase) score++;
            if (hasNumbers) score++;
            if (hasSpecialChar) score++;

            const levels = [
                {score: 0, text: 'Very Weak', className: 'very-weak'},
                {score: 1, text: 'Very Weak', className: 'very-weak'},
                {score: 2, text: 'Weak', className: 'weak'},
                {score: 3, text: 'Medium', className: 'medium'},
                {score: 4, text: 'Strong', className: 'strong'},
                {score: 5, text: 'Very Strong', className: 'strong'}
            ];

            return levels[Math.min(score, 5)];
        }

    }

    customElements.define('password-strength', PasswordStrength);

    // Check password match and length
    function checkPasswordMatch() {
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        const signupButton = document.getElementById('signup-button');

        if (confirmPassword === '') {
            passwordMatchStatus.textContent = '';
            confirmPasswordInput.classList.remove('border-green-500', 'border-red-500');
            updateSignupButtonState();
            return;
        }

        if (password === confirmPassword) {
            passwordMatchStatus.textContent = 'Passwords match';
            passwordMatchStatus.className = 'text-sm mt-1 text-green-400';
            confirmPasswordInput.classList.remove('border-red-500');
            confirmPasswordInput.classList.add('border-green-500');
        } else {
            passwordMatchStatus.textContent = 'Passwords do not match';
            passwordMatchStatus.className = 'text-sm mt-1 text-red-400';
            confirmPasswordInput.classList.remove('border-green-500');
            confirmPasswordInput.classList.add('border-red-500');
        }

        updateSignupButtonState();
    }
    // Validate email format
    function validateEmail() {
        const email = document.getElementById('login-email').value;
        const emailInput = document.getElementById('login-email');
        const emailError = document.getElementById('email-error') || document.createElement('div');

        if (!document.getElementById('email-error')) {
            emailError.id = 'email-error';
            emailError.className = 'text-sm mt-1';
            emailInput.parentNode.parentNode.appendChild(emailError);
        }
        const emailRegex = /^[^\s@]+@[^\s@]+\.(com|net|org|edu|gov|io|co|uk|de|fr|ca|au|nz|jp|cn|in|ru|br|mx|es|it|nl|se|ch|no|dk|fi|be|at|ie|pl|cz|hu|gr|pt|tr|ae|sa|kr|sg|my|th|vn|id|ph|pk|za|eg|ma|tn|dz|ly|gh|ke|ng|et|zw|mz|biz|info|name|pro|aero|coop|museum|travel|asia|app|dev|tech|online|store|shop|site|xyz|club|link|click|news|blog|cloud|digital|media|tv|video|live|world|life|fun|cool|group|team|space|work|company|solutions|services|agency|network|center|email|me|us|biz|cc|tv|ws|name|mobi|tel|jobs|cat|int|tel|post|xxx|ac|ad|ae|af|ag|ai|al|am|an|ao|aq|ar|as|at|au|aw|ax|az|ba|bb|bd|be|bf|bg|bh|bi|bj|bm|bn|bo|br|bs|bt|bv|bw|by|bz|ca|cc|cd|cf|cg|ch|ci|ck|cl|cm|cn|co|cr|cu|cv|cx|cy|cz|de|dj|dk|dm|do|dz|ec|ee|eg|er|es|et|eu|fi|fj|fk|fm|fo|fr|ga|gb|gd|ge|gf|gg|gh|gi|gl|gm|gn|gp|gq|gr|gs|gt|gu|gw|gy|hk|hm|hn|hr|ht|hu|id|ie|il|im|in|io|iq|ir|is|it|je|jm|jo|jp|ke|kg|kh|ki|km|kn|kp|kr|kw|ky|kz|la|lb|lc|li|lk|lr|ls|lt|lu|lv|ly|ma|mc|md|me|mg|mh|mk|ml|mm|mn|mo|mp|mq|mr|ms|mt|mu|mv|mw|mx|my|mz|na|nc|ne|nf|ng|ni|nl|no|np|nr|nu|nz|om|pa|pe|pf|pg|ph|pk|pl|pm|pn|pr|ps|pt|pw|py|qa|re|ro|rs|ru|rw|sa|sb|sc|sd|se|sg|sh|si|sj|sk|sl|sm|sn|so|sr|st|su|sv|sy|sz|tc|td|tf|tg|th|tj|tk|tl|tm|tn|to|tp|tr|tt|tv|tw|tz|ua|ug|uk|us|uy|uz|va|vc|ve|vg|vi|vn|vu|wf|ws|ye|yt|za|zm|zw)$/i;
        if (email && !emailRegex.test(email)) {
            emailError.textContent = 'Please enter a valid email address';
            emailError.className = 'text-sm mt-1 text-red-400';
            emailInput.classList.remove('border-green-500');
            emailInput.classList.add('border-red-500');
            return false;
        } else if (email && emailRegex.test(email)) {
            emailError.textContent = '✓ Valid email format';
            emailError.className = 'text-sm mt-1 text-green-400';
            emailInput.classList.remove('border-red-500');
            emailInput.classList.add('border-green-500');
            return true;
        } else {
            emailError.textContent = '';
            emailInput.classList.remove('border-red-500', 'border-green-500');
            return false;
        }
    }

    // Update signup button state based on password requirements
    function updateSignupButtonState() {
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        const signupButton = document.getElementById('signup-button');
        const username = document.getElementById('login-username').value;
        const email = document.getElementById('login-email').value;

        // Check if all required fields are filled and password meets requirements
        const isPasswordValid = password.length >= 8;
        const isPasswordMatch = password === confirmPassword && confirmPassword !== '';
        const areFieldsFilled = username && email && password && confirmPassword;
        const isEmailValid = validateEmail();

        signupButton.disabled = !(areFieldsFilled && isPasswordValid && isPasswordMatch && isEmailValid);
    }

    // Add validation for minimum 8 characters
    passwordInput.addEventListener('input', function() {
        const password = this.value;
        const lengthRequirement = document.getElementById('length-requirement') || document.createElement('div');

        if (!document.getElementById('length-requirement')) {
            lengthRequirement.id = 'length-requirement';
            lengthRequirement.className = 'text-sm mt-1';
            this.parentNode.parentNode.appendChild(lengthRequirement);
        }

        if (password.length > 0 && password.length < 8) {
            lengthRequirement.textContent = 'Password must be at least 8 characters';
            lengthRequirement.className = 'text-sm mt-1 text-red-400';
        } else if (password.length >= 8) {
            lengthRequirement.textContent = '✓ Minimum 8 characters';
            lengthRequirement.className = 'text-sm mt-1 text-green-400';
        } else {
            lengthRequirement.textContent = '';
        }

        updateSignupButtonState();
    });
    passwordInput.addEventListener('input', checkPasswordMatch);
    confirmPasswordInput.addEventListener('input', checkPasswordMatch);

    // Add validation for other required fields
    document.getElementById('login-username').addEventListener('input', updateSignupButtonState);
    document.getElementById('login-email').addEventListener('input', function() {
        validateEmail();
        updateSignupButtonState();
    });

    // Update password strength on input
    const passwordStrength = document.querySelector('password-strength');
    if (passwordStrength) {
        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            passwordStrength.updateStrength(password);
            passwordStrength.checkConfirmation(password, confirmPasswordInput.value);
        });

        confirmPasswordInput.addEventListener('input', () => {
            passwordStrength.checkConfirmation(passwordInput.value, confirmPasswordInput.value);
        });
    }

    VANTA.NET({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: 1.00,
        scaleMobile: 1.00,
        color: 0x3a86ff,
        backgroundColor: 0x0a0a0a,
        points: 16.00,
        maxDistance: 22.00,
        spacing: 18.00,
        showDots: false
    });

    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        console.log('Login submitted');
    });

    feather.replace();
</script>
</body>
</html>
