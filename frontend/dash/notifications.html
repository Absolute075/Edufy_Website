<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edufy - Notifications</title>
    <link rel="icon" href="https://resources.edufyuzbekistan.com/storage/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css?v=20251114-3" />
    <link rel="stylesheet" href="theme.css" />
    <script>window.__defaultAvatarUrl="https://resources.edufyuzbekistan.com/storage/images/10d554ea6f330f1612526b54562c8a33.jpg";</script>
    <script src="components.js?v=20251105-2" defer></script>
    <script src="app.js?v=20251114-6" defer></script>
</head>
<body>
<div class="animated-bg">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
</div>

<aside class="sidebar" id="sidebar"></aside>

<main class="main-content">
    <header class="header">
        <div class="header-left">
            <button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button>
        </div>
        <div class="header-right">
            <button class="header-icon-btn notification-btn" id="notificationBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span class="notification-badge">3</span>
            </button>
            <div class="header-user">
                <img src="../templates/images/caesar.png" alt="User" class="header-avatar">
                <div class="header-user-info">
                    <span class="header-username">Student</span>
                    <span class="header-status">Notifications</span>
                </div>
            </div>
        </div>
    </header>

    <div class="profile-container">
        <div class="profile-card">
            <div class="card-header">
                <div class="card-header-left">
                    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                    </svg>
                    <div>
                        <h2 class="card-title">Notifications</h2>
                        <p class="card-subtitle">Latest updates and alerts</p>
                    </div>
                </div>
                <div class="card-header-actions"></div>
            </div>
            <div class="card-body">
                <div class="list" id="notificationsList">
                    <div class="list-item">
                        <div>
                            <div class="title">Welcome to Edufy!</div>
                            <div class="muted">We’re glad you’re here. Explore your dashboard to get started.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="toast" id="toast">
    <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span class="toast-message">All notifications marked as read</span>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const list = document.getElementById('notificationsList');
        const markAll = document.getElementById('markAllReadBtn');
        markAll?.addEventListener('click', () => {
            list?.querySelectorAll('.list-item.unread')?.forEach(el => el.classList.remove('unread'));
            const toast = document.getElementById('toast');
            toast?.classList.add('active');
            setTimeout(() => toast?.classList.remove('active'), 2000);
        });
    });
</script>
</body>
</html>
