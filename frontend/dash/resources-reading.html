<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edufy - Reading Resources</title>
  <link rel="icon" href="https://resources.edufyuzbekistan.com/storage/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css?v=20251114-7" />
  <link rel="stylesheet" href="theme.css" />
  <script>window.__defaultAvatarUrl="https://resources.edufyuzbekistan.com/storage/images/10d554ea6f330f1612526b54562c8a33.jpg";</script>
  <script>window.__MATERIALS_BASE = 'https://api.edufyuzbekistan.com';</script>
  <script src="components.js" defer></script>
  <script src="app.js?v=20251114-8" defer></script>
  <style>
    :root { --anim-fast: .18s; --anim: .26s; --shadow: 0 6px 24px rgba(8,12,24,.35); }
    /* search removed */
    .tabs-wrap { position:sticky; top:64px; z-index:9; background: linear-gradient(180deg, #121826, #121826f0 60%, #12182600); padding-top:8px; padding-bottom:8px; margin-bottom:8px }
    .tabs { position:relative; display:grid; grid-template-columns: 1fr 1fr 1fr; background:#0d1322; padding:6px; border:1px solid transparent; border-radius:14px; width:100%; max-width:720px; overflow:hidden }
    .tab { position:relative; padding:10px 16px; border-radius:10px; cursor:pointer; color:var(--text); border: none; z-index:1; text-align:center; transition: color var(--anim-fast) ease; background: transparent !important; appearance: none; -webkit-appearance: none; outline: none; box-shadow: none; }
    .tab:focus, .tab:focus-visible { outline: none; box-shadow: none; }
    .tab::-moz-focus-inner { border: 0; padding: 0; }
    .tab.active { color:#dbe6ff; }
    .tabs .indicator { position:absolute; top:6px; left:6px; height:36px; border-radius:10px; transition: transform var(--anim) ease, width var(--anim) ease, background var(--anim) ease, border-color var(--anim) ease; z-index:0; }
    .tabs.theme-free .indicator { background:linear-gradient(135deg,#0b3a1f,#072a14); border:1px solid #1f9d55; }
    .tabs.theme-plus .indicator { background:linear-gradient(135deg,#0f2f66,#0a2243); border:1px solid #3b82f6; }
    .tabs.theme-pro  .indicator { background:linear-gradient(135deg,#341a72,#23114a); border:1px solid #8b5cf6; }
    .tabs.theme-free .tab.active { color:#c9f7dd; }
    .tabs.theme-plus .tab.active { color:#d7e7ff; }
    .tabs.theme-pro  .tab.active { color:#eadbff; }
    .catalog { margin-top:8px; display:grid; gap:12px; grid-template-columns: 1fr; }
    @media (min-width: 860px) { .catalog { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 1180px) { .catalog { grid-template-columns: 1fr 1fr 1fr; } }
    .item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px; border:1px solid #1a2541; border-radius:16px; background:#0f1424; transition: transform var(--anim-fast) ease, background var(--anim-fast) ease, border-color var(--anim-fast) ease, box-shadow var(--anim) ease; }
    .item:hover { transform: translateY(-2px); background:#0f1628; border-color:#263357; box-shadow: var(--shadow); }
    .item .left { display:flex; gap:12px; align-items:center }
    .ico { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; font-weight:600; letter-spacing:.2px; }
    .ico.free { background:#0f3a22; color:#b6f3c9; border:1px solid #1f9d55; }
    .ico.plus { background:#112a56; color:#cfe7ff; border:1px solid #3b82f6; }
    .ico.pro  { background:#2a175c; color:#e5d8ff; border:1px solid #8b5cf6; }
    .badge { font-size:12px; letter-spacing:.3px; color:#aab4cf; border:1px solid var(--border); padding:3px 8px; border-radius:999px; }
    .badge.free { background:#22c55e1a; border-color:#22c55e66; color:#b6f3c9; }
    .badge.plus { background:#3b82f61a; border-color:#3b82f666; color:#cfe7ff; }
    .badge.pro { background:#8b5cf61a; border-color:#8b5cf666; color:#e5d8ff; }
    .muted { color:#9aa3ba; font-size:12px }
    .btn.sm { padding:9px 14px; font-size:14px }
    @keyframes fadeUp { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
    .catalog.fade-in { animation: fadeUp var(--anim) ease both; }
    .skeleton { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px; border:1px solid #1a2541; border-radius:16px; background:#0f1424; overflow:hidden; position:relative }
    .skeleton::after { content:""; position:absolute; inset:0; background: linear-gradient(90deg, transparent, #ffffff0a, transparent); animation: shimmer 1.2s infinite }
    .sk-left { display:flex; gap:12px; align-items:center }
    .sk-ico { width:36px; height:36px; border-radius:12px; background:#1a2541 }
    .sk-lines { display:grid; gap:6px }
    .sk-line { height:10px; width:200px; background:#1a2541; border-radius:6px }
    .sk-line.small { width:120px }
    @keyframes shimmer { 0% { transform: translateX(-100%);} 100% { transform: translateX(100%);} }
  </style>
</head>
<body>
  <!-- Animated Background -->
  <div class="animated-bg">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
  </div>

  <!-- Sidebar (injected) -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- Main -->
  <main class="main-content">
    <header class="header">
      <div class="header-left">
        <button class="mobile-menu-btn" id="mobileMenuBtn"><span></span><span></span><span></span></button>
      </div>
      <div class="header-right">
        <div class="header-user"><img src="" alt="User" class="header-avatar"><div class="header-user-info"><span class="header-username">Student</span><span class="header-status">Reading</span></div></div>
      </div>
    </header>

    <div class="profile-container">
      <div class="profile-card">
        <div class="card-header">
          <div class="card-header-left">
            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"></rect></svg>
            <div>
              <h2 class="card-title">Reading Catalog</h2>
              <p class="card-subtitle">Catalog of materials by plans</p>
            </div>
          </div>
        </div>
        <div class="card-body">
          
          <div class="tabs-wrap">
          <div class="tabs theme-free" id="planTabs">
            <span class="indicator" id="tabIndicator" style="width:72px; transform: translateX(0px);"></span>
            <button class="tab active" data-plan="free">Free <span class="badge" id="count-free">0</span></button>
            <button class="tab" data-plan="plus">Plus <span class="badge" id="count-plus">0</span></button>
            <button class="tab" data-plan="pro">Pro <span class="badge" id="count-pro">0</span></button>
          </div>
          </div>
          <div class="catalog" id="catalog"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const MATERIALS_BASE = window.__MATERIALS_BASE || location.origin;
      const catalog = document.getElementById('catalog');
      const tabs = document.getElementById('planTabs');
      const counts = { free: document.getElementById('count-free'), plus: document.getElementById('count-plus'), pro: document.getElementById('count-pro') };
      const state = { plan: 'free', items: [] };

      async function loadManifest() {
        try {
          const res = await fetch(`${MATERIALS_BASE}/materials/manifest`, { cache: 'no-store' });
          const data = await res.json();
          state.items = (data.items || []).filter(x => x.category === 'reading' && x.active !== false);
          updateCounts();
          render();
        } catch (e) {
          catalog.innerHTML = '<div class="muted">Error with loading the catalog</div>';
        }
      }

      function planRank(p) { return p === 'free' ? 0 : (p === 'plus' ? 1 : 2); }

      function updateCounts() {
        const freeN = state.items.filter(i => (i.requiredPlan || 'free') === 'free').length;
        const plusN = state.items.filter(i => (i.requiredPlan || 'free') === 'plus').length;
        const proN  = state.items.filter(i => (i.requiredPlan || 'free') === 'pro' || (i.requiredPlan || 'free') === 'admin').length;
        counts.free.textContent = freeN; counts.plus.textContent = plusN; counts.pro.textContent = proN;
      }

      function buildUrlFromItem(i) {
        // Open directly from static resources to avoid API signing dependency
        try {
          const id = (i.id || '').toString();
          const last = id.split('/').pop();
          if (!last) throw new Error('bad id');
          return `https://resources.edufyuzbekistan.com/materials/reading/${last}.html`;
        } catch {
          // Fallback to previous behavior
          return `${MATERIALS_BASE}/materials/link?id=${encodeURIComponent(i.id)}`;
        }
      }

      function render() {
        // trigger smooth fade for content changes
        catalog.classList.remove('fade-in');
        const items = state.items
          .filter(i => {
            const rp = (i.requiredPlan || 'free');
            if (state.plan === 'free') return rp === 'free';
            if (state.plan === 'plus') return rp === 'plus';
            return rp === 'pro' || rp === 'admin';
          })
          .sort((a,b) => a.title.localeCompare(b.title));

        if (!items.length) { catalog.innerHTML = '<div class="muted">No materials</div>'; return; }

        catalog.innerHTML = items.map(i => {
          const url = buildUrlFromItem(i);
          const rp = (i.requiredPlan || 'free');
          return `
            <div class="item">
              <div class="left">
                <div class="ico ${rp === 'free' ? 'free' : rp === 'plus' ? 'plus' : 'pro'}">${rp[0].toUpperCase()}</div>
                <div>
                  <div class="title">${i.title || i.id}</div>
                  <div class="muted">${i.id}</div>
                </div>
                <span class="badge ${rp === 'free' ? 'free' : rp === 'plus' ? 'plus' : 'pro'}">${rp.toUpperCase()}</span>
              </div>
              <div>
                <a class="btn sm" href="${url}" target="_blank" rel="noopener">Open</a>
              </div>
            </div>
          `;
        }).join('');
        // apply fade-in after DOM update
        requestAnimationFrame(() => catalog.classList.add('fade-in'));
      }

      function getUserKey(){
        try {
          // Prefer the unified key established by components.js
          const id = (typeof window !== 'undefined' && window.__edufyUserKey)
                 || sessionStorage.getItem('edufy.user.key')
                 || localStorage.getItem('edufy.user.key')
                 || localStorage.getItem('edufy_user_id')
                 || localStorage.getItem('user.id')
                 || document.getElementById('profileId')?.textContent?.trim()
                 || document.querySelector('.header-username')?.textContent?.trim();
          return (id && id.length) ? id : null;
        } catch { return null; }
      }

      function logActivity(ev) {
        try {
          const userKey = getUserKey();
          const baseKey = 'recentActivities';
          const key = userKey ? `${baseKey}::${userKey}` : baseKey;
          // one-time migrate from global key if exists and userKey present
          if (userKey && localStorage.getItem(baseKey) && !localStorage.getItem(key)) {
            localStorage.setItem(key, localStorage.getItem(baseKey));
          }
          const arr = JSON.parse(localStorage.getItem(key) || '[]');
          arr.unshift({ type: ev.type || 'reading_open', text: ev.text || '', sub: ev.sub || '', time: Date.now() });
          localStorage.setItem(key, JSON.stringify(arr.slice(0, 50)));
        } catch {}
      }

      // Delegate click on catalog to capture Open events
      document.addEventListener('click', (e) => {
        const a = e.target && (e.target.closest ? e.target.closest('#catalog a.btn.sm') : null);
        if (!a) return;
        const itemEl = a.closest('.item');
        const title = itemEl?.querySelector('.title')?.textContent?.trim() || 'Reading material';
        const id = itemEl?.querySelector('.muted')?.textContent?.trim() || '';
        logActivity({ type: 'reading_open', text: `Opened: ${title}`, sub: id });
      });

      function renderSkeleton(n=6) {
        catalog.innerHTML = Array.from({length:n}).map(() => `
          <div class="skeleton">
            <div class="sk-left">
              <div class="sk-ico"></div>
              <div class="sk-lines">
                <div class="sk-line"></div>
                <div class="sk-line small"></div>
              </div>
            </div>
            <div class="sk-line small" style="width:80px"></div>
          </div>
        `).join('');
      }

      function moveIndicatorTo(el) {
        const ind = document.getElementById('tabIndicator');
        if (!ind || !el) return;
        const { offsetLeft: x, offsetWidth: w } = el;
        ind.style.width = w + 'px';
        ind.style.transform = `translateX(${x}px)`;
      }

      function applyThemeForPlan(plan) {
        const tabsBox = document.getElementById('planTabs');
        if (!tabsBox) return;
        tabsBox.classList.remove('theme-free','theme-plus','theme-pro');
        if (plan === 'free') tabsBox.classList.add('theme-free');
        else if (plan === 'plus') tabsBox.classList.add('theme-plus');
        else tabsBox.classList.add('theme-pro');
      }

      tabs.addEventListener('click', (e) => {
        const b = e.target.closest('.tab');
        if (!b) return;
        tabs.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        b.classList.add('active');
        state.plan = b.getAttribute('data-plan');
        render();
        moveIndicatorTo(b);
        applyThemeForPlan(state.plan);
      });

      // search removed

      renderSkeleton();
      await loadManifest();
      // set initial indicator position
      moveIndicatorTo(tabs.querySelector('.tab.active'));
      applyThemeForPlan(state.plan);
      window.addEventListener('resize', () => moveIndicatorTo(tabs.querySelector('.tab.active')));
    });
  </script>
</body>
</html>
