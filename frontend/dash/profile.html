<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edufy - Profile</title>
    <link rel="icon" href="https://resources.edufyuzbekistan.com/storage/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css?v=20251114-4">
    <link rel="stylesheet" href="theme.css">
    <script>window.__defaultAvatarUrl="https://resources.edufyuzbekistan.com/storage/images/10d554ea6f330f1612526b54562c8a33.jpg";</script>
    <script src="components.js?v=20251105-2" defer></script>
    <script src="app.js?v=20251114-7" defer></script>
</head>
<body>
<!-- Animated Background -->
<div class="animated-bg">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<!-- Sidebar (injected) -->
<aside class="sidebar" id="sidebar"></aside>

<!-- Main Content -->
<main class="main-content">
    <!-- Top Header Bar -->
    <header class="header">
        <div class="header-left">
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <div class="header-right">
            <button class="header-icon-btn notification-btn" id="notificationBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="notification-badge">5</span>
            </button>

            <div class="header-user">
                <img data-avatar src="../templates/images/caesar.png" alt="User" class="header-avatar">
                <div class="header-user-info">
                    <span class="header-username"></span>
                    <span class="header-status"></span>
                </div>
            </div>
        </div>
    </header>

    <!-- Profile Content -->
    <div class="profile-container">
        <!-- Personal Info Card -->
        <div class="profile-card">
            <div class="card-header">
                <div class="card-header-left">
                    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <div>
                        <h2 class="card-title">Personal Information</h2>
                        <p class="card-subtitle">Manage your personal details</p>
                    </div>
                </div>
                <button class="edit-btn" id="editPersonalBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                    </svg>
                    Edit
                </button>
            </div>

            <div class="card-body">
                <div class="profile-avatar-section">
                    <div class="avatar-wrapper">
                        <img data-avatar src="../templates/images/caesar.png" alt="Profile" class="profile-avatar" id="profileAvatar">
                        <div class="avatar-overlay">
                            <button class="avatar-change-btn" id="avatarChangeBtn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                    <circle cx="12" cy="13" r="4"></circle>
                                </svg>
                            </button>
                        </div>
                        <input type="file" id="avatarInput" accept="image/*" style="display:none">
                    </div>
                    <div class="avatar-info">
                        <h3 class="avatar-name"></h3>
                        <span class="avatar-tagline">Learning to achieve excellence</span>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-input" value="" id="Username">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-input" value="" id="email">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Phone Number (Optional)</label>
                        <input type="tel" class="form-input" value="" id="phone">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Date of Birth (Optional)</label>
                        <input type="date" class="form-input" value="" id="dob">
                    </div>
                </div>

                <!-- Learning Preferences (merged) -->
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">What certificate do you have?</label>
                        <select class="form-input" id="qCertificate" multiple disabled>
                            <option value="">Choose</option>
                            <option value="none">No certificate</option>
                            <optgroup label="IELTS">
                                <option data-group="IELTS" value="9.0">9.0</option>
                                <option data-group="IELTS" value="8.5">8.5</option>
                                <option data-group="IELTS" value="8.0">8.0</option>
                                <option data-group="IELTS" value="7.5">7.5</option>
                                <option data-group="IELTS" value="7.0">7.0</option>
                                <option data-group="IELTS" value="6.5">6.5</option>
                                <option data-group="IELTS" value="6.0">6.0</option>
                                <option data-group="IELTS" value="5.5">5.5</option>
                                <option data-group="IELTS" value="5.0">5.0</option>
                                <option data-group="IELTS" value="4.5">4.5</option>
                                <option data-group="IELTS" value="4.0">4.0</option>
                            </optgroup>
                            <optgroup label="TOEFL iBT">
                                <option data-group="TOEFL" value="118-120">118-120</option>
                                <option data-group="TOEFL" value="110-117">110-117</option>
                                <option data-group="TOEFL" value="95-109">95-109</option>
                                <option data-group="TOEFL" value="72-94">72-94</option>
                                <option data-group="TOEFL" value="42-71">42-71</option>
                                <option data-group="TOEFL" value="<41"><41</option>
                            </optgroup>
                            <optgroup label="SAT">
                                <option data-group="SAT" value="1550-1600">1550-1600</option>
                                <option data-group="SAT" value="1450-1540">1450-1540</option>
                                <option data-group="SAT" value="1300-1440">1300-1440</option>
                                <option data-group="SAT" value="1100-1290">1100-1290</option>
                                <option data-group="SAT" value="<1000"><1000</option>
                            </optgroup>
                            <optgroup label="AP">
                                <option data-group="AP" value="5">5</option>
                                <option data-group="AP" value="4">4</option>
                                <option data-group="AP" value="3">3</option>
                                <option data-group="AP" value="2">2</option>
                                <option data-group="AP" value="1">1</option>
                            </optgroup>
                            <optgroup label="ACT">
                                <option data-group="ACT" value="34-36">34-36</option>
                                <option data-group="ACT" value="30-33">30-33</option>
                                <option data-group="ACT" value="25-29">25-29</option>
                                <option data-group="ACT" value="20-24">20-24</option>
                                <option data-group="ACT" value="<20"><20</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Which subject are you interested in?</label>
                        <select class="form-input" id="qSubject" disabled>
                            <option value="">Choose</option>
                            <optgroup label="STEM (Science, Technology, Engineering, Mathematics)">
                                <option value="Mathematics">Mathematics</option>
                                <option value="Statistics">Statistics</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Artificial Intelligence">Artificial Intelligence</option>
                                <option value="Machine Learning">Machine Learning</option>
                                <option value="Data Science">Data Science</option>
                                <option value="Software Engineering">Software Engineering</option>
                                <option value="Web Development">Web Development</option>
                                <option value="Cybersecurity">Cybersecurity</option>
                                <option value="Robotics">Robotics</option>
                                <option value="Engineering">Engineering</option>
                                <option value="Mechanical Engineering">Mechanical Engineering</option>
                                <option value="Electrical Engineering">Electrical Engineering</option>
                                <option value="Civil Engineering">Civil Engineering</option>
                                <option value="Architecture">Architecture</option>
                                <option value="Physics">Physics</option>
                                <option value="Chemistry">Chemistry</option>
                                <option value="Biology">Biology</option>
                                <option value="Environmental Science">Environmental Science</option>
                                <option value="Astronomy">Astronomy</option>
                                <option value="Geology">Geology</option>
                                <option value="Material Science">Material Science</option>
                                <option value="Biotechnology">Biotechnology</option>
                                <option value="Genetics">Genetics</option>
                                <option value="Nanotechnology">Nanotechnology</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Game Development">Game Development</option>
                            </optgroup>
                            <optgroup label="Economics and Business">
                                <option value="Economics">Economics</option>
                                <option value="Finance">Finance</option>
                                <option value="Accounting">Accounting</option>
                                <option value="Business Management">Business Management</option>
                                <option value="Entrepreneurship">Entrepreneurship</option>
                                <option value="Marketing">Marketing</option>
                                <option value="International Business">International Business</option>
                                <option value="Supply Chain Management">Supply Chain Management</option>
                                <option value="Project Management">Project Management</option>
                                <option value="Human Resources">Human Resources</option>
                                <option value="Business Analytics">Business Analytics</option>
                            </optgroup>
                            <optgroup label="Social Sciences">
                                <option value="Psychology">Psychology</option>
                                <option value="Sociology">Sociology</option>
                                <option value="Anthropology">Anthropology</option>
                                <option value="Political Science">Political Science</option>
                                <option value="International Relations">International Relations</option>
                                <option value="History">History</option>
                                <option value="Geography">Geography</option>
                                <option value="Linguistics">Linguistics</option>
                                <option value="Law">Law</option>
                                <option value="Education">Education</option>
                                <option value="Ethics">Ethics</option>
                                <option value="Philosophy">Philosophy</option>
                                <option value="Criminology">Criminology</option>
                                <option value="Public Policy">Public Policy</option>
                                <option value="Communication Studies">Communication Studies</option>
                            </optgroup>
                            <optgroup label="Humanities">
                                <option value="English Language">English Language</option>
                                <option value="Literature">Literature</option>
                                <option value="Creative Writing">Creative Writing</option>
                                <option value="Journalism">Journalism</option>
                                <option value="Media Studies">Media Studies</option>
                                <option value="Religious Studies">Religious Studies</option>
                                <option value="Cultural Studies">Cultural Studies</option>
                                <option value="Comparative Literature">Comparative Literature</option>
                                <option value="Classics">Classics</option>
                                <option value="Archaeology">Archaeology</option>
                                <option value="Gender Studies">Gender Studies</option>
                                <option value="Language Studies">Language Studies</option>
                            </optgroup>
                            <optgroup label="Arts and Creative Disciplines">
                                <option value="Design">Design</option>
                                <option value="Graphic Design">Graphic Design</option>
                                <option value="Industrial Design">Industrial Design</option>
                                <option value="Interior Design">Interior Design</option>
                                <option value="Fashion Design">Fashion Design</option>
                                <option value="Visual Arts">Visual Arts</option>
                                <option value="Painting">Painting</option>
                                <option value="Sculpture">Sculpture</option>
                                <option value="Photography">Photography</option>
                                <option value="Music">Music</option>
                                <option value="Music Theory">Music Theory</option>
                                <option value="Performing Arts">Performing Arts</option>
                                <option value="Theatre">Theatre</option>
                                <option value="Film Studies">Film Studies</option>
                                <option value="Dance">Dance</option>
                                <option value="Digital Arts">Digital Arts</option>
                                <option value="Animation">Animation</option>
                                <option value="Game Design">Game Design</option>
                                <option value="Creative Media">Creative Media</option>
                                <option value="Multimedia Arts">Multimedia Arts</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">How many hours do you spend for a study per day?</label>
                        <select class="form-input" id="qDailyHours" disabled>
                            <option value="">Choose</option>
                            <option value="0-1">0-1</option>
                            <option value="2-3">2-3</option>
                            <option value="4-5">4-5</option>
                            <option value="6-7">6-7</option>
                            <option value="8-9">8-9</option>
                            <option value="10+">10+</option>
                        </select>
                    </div>
                </div>

                <button class="btn-primary" id="savePersonalBtn" style="display:none">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    Save Changes
                </button>
            </div>
        </div>
    </div>
</main>



<!-- Toast Notification -->
<div class="toast" id="toast">
    <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span class="toast-message">Changes saved successfully!</span>
</div>
</body>
</html>
