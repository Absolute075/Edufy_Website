<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edufy - Reset Password</title>
    <link rel="icon" href="templates/images/favicon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
        }
        .auth-container {
            background: rgba(15, 15, 15, 0);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-field {
            background: rgba(30, 30, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-field:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.3);
        }
        .logo-glow {
            filter: drop-shadow(0 0 8px rgba(74, 144, 226, 0.6));
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div id="vanta-bg" class="fixed top-0 left-0 w-full h-full z-0"></div>

<div class="relative z-10 w-full max-w-md mx-auto">
    <div class="auth-container rounded-2xl p-8 shadow-xl mx-auto" data-aos="fade-up" style="max-width: 28rem;">
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <img src="https://huggingface.co/spaces/Mekashiki/edufy-brainy-login-portal/resolve/main/images/favicon.png" alt="Edufy Logo" class="h-16 w-16 rounded-full object-cover logo-glow">
            </div>
            <h1 class="text-4xl font-bold mb-2 font-space logo-glow text-white">Reset Password</h1>
            <p class="text-white">Enter your email to receive a password reset code.</p>
        </div>

        <form id="reset-form" class="space-y-4">
            <div class="relative">
                <label for="reset-email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                <div class="relative">
                    <input type="email" id="reset-email" class="input-field w-full px-4 py-3 rounded-lg focus:outline-none pl-10" placeholder="your@email.com" required>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-mail absolute left-3 top-3.5 text-gray-400 w-4 h-4">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </div>
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-400 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-full transition-all duration-300 flex items-center justify-center shadow-lg hover:shadow-blue-500/20 transform hover:-translate-y-1">
                Send Reset Code
            </button>
            <div class="text-center mt-4 text-sm text-gray-300">
                Remember your password? <a href="https://access.edufyuzbekistan.com/login" class="text-blue-400 hover:text-blue-300 font-medium transition-colors">Sign in</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
<script>
    document.getElementById("reset-form").addEventListener("submit", function(e) {
        e.preventDefault(); // чтобы не перезагружалась страница

        // пример: можно потом добавить fetch() сюда
        // fetch('/auth/send-code', { method: 'POST', body: JSON.stringify({ email }) })

        // а пока просто переход:
        window.location.href = "https://access.edufyuzbekistan.com/forgot_password/reset_password/verify_code";
    });

    AOS.init({ duration: 800, easing: 'ease-in-out', once: true });

    VANTA.NET({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: 1.00,
        scaleMobile: 1.00,
        color: 0x3a86ff,
        backgroundColor: 0x0a0a0a,
        points: 16.00,
        maxDistance: 22.00,
        spacing: 18.00,
        showDots: false
    });

    feather.replace();
</script>

</body>
</html>
