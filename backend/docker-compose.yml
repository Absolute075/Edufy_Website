version: "3.9"

services:
  db:
    image: postgres:16
    container_name: db
    environment:
      POSTGRES_DB: edufy_auth
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: star4536446
      TZ: Asia/Tashkent
      PGTZ: Asia/Tashkent
    ports:
      - "5432:5432"
    volumes:
      - edufy_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    restart: always
    networks:
      - edufy_net

  file_service:
    build: ./services/file_service
    image: file_service:latest
    container_name: file_service
    ports:
      - "8084:8080" # 8084 внешний порт docker, 8080 внутренний порт Spring Boot
    environment:
      - PORT=8080
      - USER_SERVICE_URL=http://user_service:8080
      - RESOURCES_BASE=https://resources.edufyuzbekistan.com
      - MATERIALS_DIR=/materials
      - AUTOSCAN_SECONDS=5
      - DEFAULT_REQUIRED_PLAN=free
      - PLAN_DEFAULT_READING=free
      - PLAN_DEFAULT_LISTENING=plus
      - PLAN_DEFAULT_SPEAKING=plus
      - PLAN_DEFAULT_WRITING=pro
      - PLAN_DEFAULT_MOCK=pro
      - OVERRIDES_PATH=/app/public/materials/overrides.json
      - REINDEX_ADMIN_TOKEN=edufy
      - LINK_TTL_SECONDS=120
      - LINK_SIGNING_SECRET=
    env_file:
      .env
    volumes:
      - ./services/file_service/public:/app/public:ro
      - /materials:/materials:ro
    restart: always
    networks:
      - edufy_net

  auth_service:
    build: ./services/auth_service
    image: auth_service:latest
    container_name: auth_service
    ports:
      - "8081:8080" #8081 внешний порт docker, 8080 внутренний порт Spring Boot
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: https://access.edufyuzbekistan.com/auth/oauth/google/callback
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/edufy_auth
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: star4536446
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      INFOBIP_BASE_URL: ${INFOBIP_BASE_URL}
      INFOBIP_API_KEY: ${INFOBIP_API_KEY}
      INFOBIP_FROM_EMAIL: ${INFOBIP_FROM_EMAIL}
      USER_SERVICE_URL: "http://user_service:8080"
      SERVER_PORT: 8080
      env_file:
        .env
    depends_on:
      - db
    restart: always
    networks:
      - edufy_net



  user_service:
      build: ./services/user_service
      image: user_service:latest
      container_name: user_service
      ports:
        - "8083:8080" #8083 внешний порт docker, внутренний порт Spring Boot
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/edufy_users
        SPRING_DATASOURCE_USERNAME: admin
        SPRING_DATASOURCE_PASSWORD: star4536446
        SPRING_JPA_HIBERNATE_DDL_AUTO: update
        SERVER_PORT: 8080
        # SFTP to VPS Storage
        STORAGE_SFTP_HOST: "109.199.119.214"
        STORAGE_SFTP_PORT: "22"
        STORAGE_SFTP_USER: "root"
        STORAGE_SFTP_KEY_PATH: "/app/ssh/id_rsa"
        STORAGE_SFTP_KEY_PASSPHRASE: ""
        STORAGE_SFTP_DEST_DIR: "/var/www/Edufy_Website/storage/avatars"
      depends_on:
        - db
      restart: always
      volumes:
        - /var/www/Edufy_Website/storage/avatars:/var/www/Edufy_Website/storage/avatars
        # Mount read-only SSH key for SFTP
        - /root/.ssh/storage_id_rsa:/app/ssh/id_rsa:ro
      networks:
       - edufy_net



  gateway_service:
    build: ./services/gateway_service
    image: gateway_service:latest
    container_name: gateway_service
    ports:
      - "8082:8080" #8082 внешний порт docker, 8080 внутренний порт Gin
    environment:
      AUTH_SERVICE_URL: http://auth_service:8080
      USER_SERVICE_URL: http://user_service:8080
      FILE_SERVICE_URL: http://file_service:8080
      GATEWAY_URL: http://gateway_service:8080
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_CONTACT_BOT_TOKEN: ${TELEGRAM_CONTACT_BOT_TOKEN}
      TELEGRAM_CONTACT_CHAT_ID: ${TELEGRAM_CONTACT_CHAT_ID}
    depends_on:
      - auth_service
      - user_service
    restart: always
    networks:
      - edufy_net

volumes:
  edufy_db_data:

networks:
  edufy_net:
    driver: bridge
