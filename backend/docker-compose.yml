version: "3.9"

services:
  db:
    image: postgres:16
    container_name: db
    environment:
      POSTGRES_DB: edufy
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: star4536446
      TZ: Asia/Tashkent
      PGTZ: Asia/Tashkent
    ports:
      - "15432:5432"
    volumes:
      - edufy_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    restart: always
    networks:
      - edufy_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1gb -Xmx1gb
    ports:
      - "9200:9200"
    networks:
      - edufy_net

  search_service:
    build: ./services/search_service
    image: search_service:latest
    container_name: search_service
    ports:
      - "8085:8080" # 8085 external, 8080 internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SEARCH_SERVICE_PORT=8080
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - AUTH_SERVICE_URL=http://host.docker.internal:8081
      - USER_SERVICE_URL=http://host.docker.internal:8083
    depends_on:
      - elasticsearch
    restart: always
    networks:
      - edufy_net



  admin_service:
    build: ./services/admin_service
    image: admin_service:latest
    container_name: admin_service
    ports:
      - "8090:8080" # 8090 внешний порт docker, 8080 внутренний порт admin_service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ADMIN_SERVICE_PORT: 8080
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      AUTH_SERVICE_URL: http://auth_service:8080
      USER_SERVICE_URL: http://host.docker.internal:8083
      FILE_SERVICE_URL: http://file_service:8080
      GATEWAY_URL: http://gateway_service:8080
    depends_on:
      - auth_service
      - user_service
      - gateway_service
    restart: always
    networks:
      - edufy_net

  file_service:
    build: ./services/file_service
    image: file_service:latest
    container_name: file_service
    ports:
      - "8084:8080" # 8084 внешний порт docker, 8080 внутренний порт Spring Boot
    environment:
      - PORT=8080
      - USER_SERVICE_URL=http://userservice:8080
      - RESOURCES_BASE=https://resources.edufyuzbekistan.com
      - MATERIALS_DIR=/materials
      - AUTOSCAN_SECONDS=5
      - DEFAULT_REQUIRED_PLAN=free
      - PLAN_DEFAULT_READING=free
      - PLAN_DEFAULT_LISTENING=plus
      - PLAN_DEFAULT_SPEAKING=plus
      - PLAN_DEFAULT_WRITING=pro
      - PLAN_DEFAULT_MOCK=pro
      - OVERRIDES_PATH=/app/public/materials/overrides.json
      - REINDEX_ADMIN_TOKEN=edufy
      - LINK_TTL_SECONDS=120
      - LINK_SIGNING_SECRET=
    env_file:
      .env
    volumes:
      - ./services/file_service/public:/app/public:ro
      - /materials:/materials:ro
    restart: always
    networks:
      - edufy_net

  auth_service:
    build: ./services/auth_service
    image: auth_service:latest
    container_name: auth_service
    ports:
      - "8081:8080" #8081 внешний порт docker, 8080 внутренний порт Spring Boot
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: https://access.edufyuzbekistan.com/auth/oauth/google/callback
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/edufy
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: star4536446
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      INFOBIP_BASE_URL: ${INFOBIP_BASE_URL}
      INFOBIP_API_KEY: ${INFOBIP_API_KEY}
      INFOBIP_FROM_EMAIL: ${INFOBIP_FROM_EMAIL}
      USER_SERVICE_URL: "http://userservice:8080"
      SERVER_PORT: 8080
      env_file:
        .env
    depends_on:
      - db
    restart: always
    networks:
      - edufy_net



  user_service:
      build: ./services/user_service
      image: user_service:latest
      container_name: user_service
      ports:
        - "8083:8080" #8083 внешний порт docker, внутренний порт Spring Boot
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/edufy
        SPRING_DATASOURCE_USERNAME: admin
        SPRING_DATASOURCE_PASSWORD: star4536446
        SPRING_JPA_HIBERNATE_DDL_AUTO: update
        SERVER_PORT: 8080
        # SFTP to VPS Storage
        STORAGE_SFTP_HOST: "109.199.119.214"
        STORAGE_SFTP_PORT: "22"
        STORAGE_SFTP_USER: "root"
        STORAGE_SFTP_KEY_PATH: "/app/ssh/id_rsa"
        STORAGE_SFTP_KEY_PASSPHRASE: ""
        STORAGE_SFTP_DEST_DIR: "/var/www/Edufy_Website/storage/avatars"
      depends_on:
        - db
      restart: always
      volumes:
        - /var/www/Edufy_Website/storage/avatars:/var/www/Edufy_Website/storage/avatars
        - /root/.ssh/storage_id_rsa/id_rsa:/app/ssh/id_rsa:ro
      networks:
        edufy_net:
          aliases:
            - userservice



  gateway_service:
    build: ./services/gateway_service
    image: gateway_service:latest
    container_name: gateway_service
    ports:
      - "8082:8080" #8082 внешний порт docker, 8080 внутренний порт Gin
    environment:
      AUTH_SERVICE_URL: http://auth_service:8080
      USER_SERVICE_URL: http://userservice:8080
      FILE_SERVICE_URL: http://file_service:8080
      GATEWAY_URL: http://gateway_service:8080
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      USD_TO_UZS_FALLBACK_RATE: "12000"
      EXCHANGERATE_HOST_API_KEY: ${EXCHANGERATE_HOST_API_KEY}
    depends_on:
      - auth_service
      - user_service
    restart: always
    networks:
      - edufy_net

  dockmon:
    image: darthnorse/dockmon:latest
    container_name: dockmon
    restart: unless-stopped
    ports:
      - "8001:443" # 8001 внешний порт docker, 443 внутренний порт DockMon (HTTPS)
    environment:
      - TZ=Asia/Tashkent
    volumes:
      - dockmon_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - edufy_net

volumes:
  edufy_db_data:
  dockmon_data:

networks:
  edufy_net:
    driver: bridge
